include:
  - project: "ExplorViz/code/deployment"
    file: ".gitlab-ci-explorviz-common.yml"

default:
  tags:
    - exec-docker
  image: ghcr.io/graalvm/graalvm-community:21
  cache: # Cache modules in between jobs
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .gradle
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

stages:
  - build
  - code-analysis
  - test
  - deploy:images

build:
  stage: build
  script: ./gradlew --build-cache assemble
  cache:
    policy: push
    paths:
      - .gradle
  artifacts:
    paths:
      - build

spotless:
  stage: code-analysis
  script: ./gradlew spotlessCheck

checkstyle:
  stage: code-analysis
  script:
    - |
      set +e
      ./gradlew checkstyleMain --continue
      CHECKSTYLE_EXIT=$?
      python3 code-analysis/ci/gitlab-code-quality.py build/reports/checkstyle/main.xml build/reports/ci/checkstyle-code-quality.json
      python3 code-analysis/ci/report-summary.py build/reports/checkstyle/main.xml
      exit $CHECKSTYLE_EXIT
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      codequality: build/reports/ci/checkstyle-code-quality.json
    paths:
      - build/reports/checkstyle/
      - build/reports/ci/checkstyle-code-quality.json

test:
  stage: test
  script:
    - |
      set +e
      ./gradlew test jacocoTestReport --continue
      TEST_EXIT=$?
      REPORT_TEST_EXIT_CODE=$TEST_EXIT \
      python3 code-analysis/ci/report-summary.py junit build/test-results/test \
        --jacoco build/reports/jacoco/test/jacocoTestReport.xml
      cat build/reports/jacoco/test/html/index.html | grep -o 'Total[^%]*%' | sed 's/<.*>/ /; s/Total/Jacoco Coverage Total:/'
      exit $TEST_EXIT
  coverage: "/Jacoco Coverage Total: ([0-9]{1,3})%/"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/test/
      - build/reports/jacoco/test/html/
      - build/reports/jacoco/test/jacocoTestReport.xml

push-dockerhub-native-mr:
  extends: .build-and-deploy-quarkus-native
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    IMAGE_TAG: mr-${CI_MERGE_REQUEST_IID}-native

push-dockerhub-mr:
  extends: .build-and-deploy-quarkus-jvm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    IMAGE_TAG: mr-${CI_MERGE_REQUEST_IID}-jvm
