plugins {
  id 'java'
  id 'io.quarkus'
  id 'com.adarshr.test-logger' version '4.0.0'
  id 'com.diffplug.spotless' version '8.10.4'
}

apply from: 'code-analysis/code-analysis.gradle'

repositories {
  mavenCentral()
}

sourceSets {
  integrationTest {
    java.srcDir file('src/integrationTest/java')
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.output
  }
}

tasks.register('integrationTest', Test) {
  description = 'Runs integration tests.'
  group = 'verification'

  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  shouldRunAfter tasks.named('test')
}

configurations {
  integrationTestImplementation.extendsFrom implementation
  integrationTestRuntimeOnly.extendsFrom runtimeOnly
}

sourceSets.main.java.srcDirs = ['build/classes/java/quarkus-generated-sources/grpc', 'src/main/java']

dependencies {
  implementation 'io.quarkus:quarkus-opentelemetry'
  implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")

  implementation 'io.quarkus:quarkus-container-image-jib'
  implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'
  implementation 'io.quarkus:quarkus-micrometer-opentelemetry'

  // Base
  implementation 'io.quarkus:quarkus-resteasy-jackson'
  implementation 'io.quarkus:quarkus-resteasy'
  implementation 'io.quarkus:quarkus-grpc'
  implementation 'io.quarkus:quarkus-messaging'

  // Utility
  implementation 'org.apache.commons:commons-lang3'

  // JSR-305 annotations (fixes "unknown enum constant When.MAYBE" warning)
  implementation 'com.google.code.findbugs:jsr305:3.0.2'

  // Auth
  implementation 'io.quarkus:quarkus-oidc'
  implementation 'io.quarkus:quarkus-mongodb-panache'

  // Kafka
  implementation 'io.quarkus:quarkus-messaging-kafka'

  testImplementation 'io.smallrye.reactive:smallrye-reactive-messaging-in-memory'

  testImplementation 'io.quarkus:quarkus-junit'
  testImplementation 'io.quarkus:quarkus-junit-mockito'
  testImplementation 'io.rest-assured:rest-assured'
  testImplementation 'org.mockito:mockito-core'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  // Integration Testing
  integrationTestImplementation 'io.quarkus:quarkus-junit'
  integrationTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  integrationTestImplementation 'org.testcontainers:testcontainers'
  integrationTestImplementation 'org.testcontainers:testcontainers-kafka'
}

tasks.named('check') {
  dependsOn tasks.named('integrationTest')
}

group = 'net.explorviz'
version = '1.0-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.release = 21
  options.compilerArgs << '-parameters'
  // Turn on all javac warnings instead of classfile and processing, which produces many false-positives about
  // annotations and cast which is triggered by the auto-generated Dao implementations
  options.compilerArgs << "-Xlint:all" << "-Xlint:-classfile" << "-Xlint:-processing" << "-Xlint:-cast"
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
  systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}

tasks.named('checkstyleMain') {
  dependsOn(':compileQuarkusGeneratedSourcesJava')
}

tasks.named('spotlessCheck') {
  dependsOn(':compileQuarkusGeneratedSourcesJava')
}
